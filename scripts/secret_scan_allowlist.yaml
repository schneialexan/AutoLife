# Entries require a short justification — reviewed when touched.
#
# path_prefixes: skip scanning paths starting with these (repo-relative, POSIX slashes).
path_prefixes:
  - path_prefix: ".cursor/"
    reason: Planner metadata — no production secrets expected

# line_regex_skip: skip a hit when the FULL line matches one of these (compiled case-insensitive).
line_regex_skip:
  - '\\bsk_live_00+[a-z0-9]{20,}\\s*#' # synthetic documentation pattern
  - "SUPABASE_SERVICE_ROLE_KEY=YOUR_"
  - "REPLACE_ME"

# entropy_sample_allowlist_substrings:
# Lines containing these literals skip high-entropy heuristics (test fixtures names only).
entropy_skip_substrings:
  - "YOUR_LOCAL_ANON_JWT_HERE"
  - "EXAMPLE_SIGNING_SECRET"
  - "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.TEST"
