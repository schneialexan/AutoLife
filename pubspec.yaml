name: autolife_workspace
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

workspace:
  - packages/autolife-ui
  - packages/autolife-core
  - apps/autolife-shell

dev_dependencies:
  flutter_lints: ^6.0.0
  melos: ^7.7.0

# Melos v7+ reads workspace configuration from `pubspec.yaml`.
melos:
  packages:
    - packages/**
    - apps/**
  scripts:
    bootstrap:
      run: melos exec -- flutter pub get
    format:check:
      run: melos exec -- dart format --set-exit-if-changed .
    lint:
      run: melos exec -- dart analyze --fatal-infos
    test:
      run: melos exec -- flutter test

