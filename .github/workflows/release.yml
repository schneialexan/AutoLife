name: Release APKs

# Builds a release APK for every Flutter app under apps/* and attaches them to a
# GitHub Release, so they can be sideloaded onto a phone (e.g. Poco F5).
#
# Trigger by pushing a tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# Or run manually from the Actions tab (workflow_dispatch).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  discover:
    name: Discover Flutter apps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - uses: actions/checkout@v5
      - id: find
        name: Find apps/* with a pubspec.yaml
        shell: bash
        run: |
          apps=$(find apps -mindepth 2 -maxdepth 2 -name pubspec.yaml -printf '%h\n' \
            | sed 's#^apps/##' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "apps=$apps"
          echo "matrix={\"app\":$apps}" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$apps" | jq 'length')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.app }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get

      - name: Configure release signing
        working-directory: apps/${{ matrix.app }}/android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEY_ALIAS="${ANDROID_KEY_ALIAS:-autolife}"

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set — release will fall back to the debug key."
            echo "Run scripts/getbase64.ps1 locally, then paste the output into the secret."
            exit 0
          fi

          keystore_b64="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')"
          if ! printf '%s' "$keystore_b64" | base64 --ignore-garbage -d > app/upload-keystore.jks; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 (${#keystore_b64} chars after cleanup)."
            echo "Re-run scripts/getbase64.ps1, copy the full line from autolife-release.jks.b64,"
            echo "and replace the ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          fi
          if [ ! -s app/upload-keystore.jks ]; then
            echo "::error::Decoded keystore is empty — ANDROID_KEYSTORE_BASE64 may be truncated (${#keystore_b64} chars)."
            exit 1
          fi
          echo "Using ANDROID_KEYSTORE_BASE64 secret (${#keystore_b64} chars)"

          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD secrets are required."
            exit 1
          fi

          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
          } > key.properties
          echo "Configured release signing with the shared keystore."

      - name: Build release APK
        working-directory: apps/${{ matrix.app }}
        shell: bash
        run: |
          # Derive a versionName from the tag (strip leading "v") and use the
          # monotonic workflow run number as the versionCode, so every release
          # has a strictly higher version code than the previous one. This
          # prevents Android's "App not installed" version downgrade error on
          # sideload upgrades, without needing to bump pubspec by hand.
          tag="${GITHUB_REF_NAME}"
          build_name="${tag#v}"
          flutter build apk --release \
            --build-name="${build_name}" \
            --build-number="${GITHUB_RUN_NUMBER}"

      - name: Rename APK
        shell: bash
        run: |
          src="apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk"
          dst="autolife-${{ matrix.app }}-${{ github.ref_name }}.apk"
          mkdir -p dist
          cp "$src" "dist/$dst"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: autolife-${{ matrix.app }}
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all APKs
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            AutoLife app builds for tag ${{ github.ref_name }}.

            **Install on your phone (sideload):** download the relevant
            `autolife-<app>-${{ github.ref_name }}.apk` below and open it on the device.
            See `docs/distribution.md` for full steps.
