name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install root dependencies
        run: dart pub get

      - name: Melos bootstrap
        run: dart run melos bootstrap

      - name: Format
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: dart run melos run analyze

      - name: Codegen up-to-date (autolife-core)
        run: |
          cd packages/autolife-core
          dart run build_runner build --delete-conflicting-outputs
          dart run tool/generate_policy_matrix.dart
          dart format lib/src/policy/
          cd ../..
          git diff --exit-code

      - name: Test
        run: dart run melos run test

      - name: Golden tests (autolife-ui)
        run: cd packages/autolife-ui && flutter test --tags golden

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        run: supabase start

      - name: Apply migrations and seed (verify baseline)
        run: supabase db reset

      - name: pgTAP RLS + policy gates
        run: |
          set -a
          eval "$(supabase status -o env)"
          set +a
          supabase test db supabase/tests/rls
          dart run scripts/rls_coverage_gate.dart
          dart run scripts/policy_drift_check.dart
          dart run scripts/sensitivity_tier_lint.dart

      - name: autolife-core RLS (Tenancy + RolePolicy integration)
        run: |
          set -a
          eval "$(supabase status -o env)"
          set +a
          export SUPABASE_URL="${API_URL}"
          export SUPABASE_ANON_KEY="${ANON_KEY}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY}"
          cd packages/autolife-core
          flutter test test/tenancy/supabase_rls_integration_test.dart

      - name: Supabase db lint
        run: supabase db lint --fail-on error

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge function tests (Deno)
        run: |
          set -a
          eval "$(supabase status -o env)"
          set +a
          export SUPABASE_URL="${API_URL}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY}"
          export SUPABASE_DB_DIRECT_URL="${DB_URL}"
          (cd supabase/functions/process-event && deno test --allow-env --allow-net)
          (cd supabase/functions/bootstrap && deno test)

      - name: autolife-core Supabase producer integration
        run: |
          set -a
          eval "$(supabase status -o env)"
          set +a
          export SUPABASE_URL="${API_URL}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY}"
          cd packages/autolife-core
          dart test test/services/supabase_event_producer_integration_test.dart

      - name: Enable Linux desktop (autolife-shell integration)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          flutter config --enable-linux-desktop

      - name: autolife-shell phase 1.8 smoke integration
        run: |
          set -a
          eval "$(supabase status -o env)"
          set +a
          cd apps/autolife-shell
          flutter test integration_test/phase1_smoke_test.dart -d linux \
            --dart-define=SUPABASE_URL="${API_URL}" \
            --dart-define=SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY}" \
            --dart-define=AUTOLIFE_SMOKE_INTEGRATION_TEST=true

      - name: autolife-shell phase 2.1 auth integration (anon)
        run: |
          set -a
          eval "$(supabase status -o env)"
          set +a
          cd apps/autolife-shell
          flutter test integration_test/phase2_1_auth_test.dart -d linux \
            --dart-define=SUPABASE_URL="${API_URL}" \
            --dart-define=AUTOLIFE_SUPABASE_ANON_KEY="${ANON_KEY}"

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true

      - name: Verify Supabase scaffold
        run: test -f supabase/config.toml && test -d supabase/migrations && test -d supabase/functions
