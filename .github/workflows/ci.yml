name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install root dependencies
        run: dart pub get

      - name: Melos bootstrap
        run: dart run melos bootstrap

      - name: Format
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: dart run melos run analyze

      - name: Codegen up-to-date (autolife-core)
        run: |
          cd packages/autolife-core
          dart run build_runner build --delete-conflicting-outputs
          cd ../..
          git diff --exit-code

      - name: Test
        run: dart run melos run test

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase scaffold
        run: test -f supabase/config.toml && test -d supabase/migrations && test -d supabase/functions
