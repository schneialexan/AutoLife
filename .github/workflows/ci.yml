name: CI

# Analyze, format-check and test every Flutter app under apps/* on each push / PR.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  discover:
    name: Discover Flutter apps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        shell: bash
        run: |
          apps=$(find apps -mindepth 2 -maxdepth 2 -name pubspec.yaml -printf '%h\n' \
            | sed 's#^apps/##' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix={\"app\":$apps}" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$apps" | jq 'length')" >> "$GITHUB_OUTPUT"

  check:
    name: Check ${{ matrix.app }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get

      - name: Format check
        working-directory: apps/${{ matrix.app }}
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze

      - name: Test
        working-directory: apps/${{ matrix.app }}
        run: flutter test
