name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Format check
        run: melos run format:check

      - name: Lint
        run: melos run lint

      - name: Test
        run: melos run test

      - name: Build Flutter web (autolife-shell)
        run: |
          cd apps/autolife-shell
          flutter build web --release

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Supabase db reset (migrations + seed)
        run: |
          supabase start
          supabase db reset --local
          supabase stop

