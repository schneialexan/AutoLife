name: autolife

packages:
  - apps/**
  - packages/**

command:
  bootstrap:
    usePubspecOverrides: true

ide:
  intellij: false

scripts:
  analyze:
    run: melos exec -c 1 -- "dart analyze ."
    description: Run Dart analyzer in every package.

  format:
    run: dart format --set-exit-if-changed .
    description: Verify formatting from the repository root.

  generate-policy-matrix:
    run: melos exec -c 1 --scope=autolife_core -- "dart pub get && dart run tool/generate_policy_matrix.dart"
    description: Regenerate policy YAML → Dart + migration seed markers.

  test:core:
    # `dart test` cannot load this package's barrel (Flutter / path_provider / drift); use Flutter's test VM.
    run: melos exec -c 1 --fail-fast --scope=autolife_core --dir-exists=test -- flutter test

  test:ui:
    run: melos exec -c 1 --fail-fast --scope=autolife_ui --dir-exists=test -- flutter test --exclude-tags golden

  test:ui:goldens:
    run: melos exec -c 1 --fail-fast --scope=autolife_ui --dir-exists=test -- flutter test --tags golden
    description: Golden snapshots for autolife_ui (run on Linux CI).

  gallery:
    run: melos exec -c 1 --scope=autolife_ui_gallery -- flutter run -d chrome -t lib/main.dart
    description: Launch Widgetbook gallery for autolife_ui on Chrome.

  test:shell:
    run: melos exec -c 1 --fail-fast --scope=autolife_shell --dir-exists=test -- flutter test

  supabase:reset:
    run: supabase db reset
    description: Reset local Supabase DB, apply migrations, and run seed.sql.

  test:
    steps:
      - melos run test:core
      - melos run test:ui
      - melos run test:shell
    description: Run Dart and Flutter tests for workspace packages.
