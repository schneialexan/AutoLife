name: autolife_shell
description: AutoLife Flutter shell (navigation, dashboard scaffold).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  app_links: ^6.4.0
  autolife_core:
    path: ../../packages/autolife-core
  autolife_ui:
    path: ../../packages/autolife-ui
  cryptography: ^2.7.0
  cupertino_icons: ^1.0.8
  drift: ^2.22.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  flutter_staggered_grid_view: ^0.7.0
  go_router: ^14.6.2
  shared_preferences: ^2.5.3
  supabase: ^2.10.0
  url_launcher: ^6.3.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
